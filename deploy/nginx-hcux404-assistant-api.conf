# HCUX404: add this inside the existing `server { server_name ai.teagasc.net; ... }` block (next to /code-api/).
#
# The assistant APIs behind the AI Portal. The apps listen on 127.0.0.1 only; this location is the only way in.
# Callers allowed:
#   - the AI Portal's nginx on HCUX402, which proxies the hub's requests here;
#   - this host and its Docker networks (TeagascGPT's knowledge-mcp).
# Everyone else gets 403.
#
#   /assistant-api/research/  -> Research Papers  127.0.0.1:8000  (docker compose, TeagascResearchAssistant)
#   /assistant-api/policy/    -> Policy Assistant 127.0.0.1:8020  (systemd, PoliciesAIAssistant)
#   /assistant-api/handbook/  -> Staff Handbook   127.0.0.1:8030  (systemd, PoliciesAIAssistant + handbook.env)
#   /assistant-api/teagask/   -> Teag-Ask         127.0.0.1:8040  (systemd, TeagAskAzure)
location /assistant-api/ {
    allow 127.0.0.1;
    allow HCUX402_IP;                 # replace with HCUX402's address (run `hostname -I` on HCUX402)
    allow 172.16.0.0/12;              # Docker networks on HCUX404 (knowledge-mcp for TeagascGPT)
    deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;              # answers stream (NDJSON / SSE)
    proxy_cache off;
    proxy_read_timeout 600s;          # Research deep research takes 2-3 minutes
    client_max_body_size 25m;         # voice recordings and Teag-Ask attachments

    # The trailing slash on proxy_pass strips the prefix, so each app keeps serving from "/".
    location /assistant-api/research/ { proxy_pass http://127.0.0.1:8000/; }
    location /assistant-api/policy/   { proxy_pass http://127.0.0.1:8020/; }
    location /assistant-api/handbook/ { proxy_pass http://127.0.0.1:8030/; }
    location /assistant-api/teagask/  { proxy_pass http://127.0.0.1:8040/; }
}
