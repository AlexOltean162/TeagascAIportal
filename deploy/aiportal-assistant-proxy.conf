# HCUX402: copy to /etc/nginx/snippets/aiportal-assistant-proxy.conf (used by nginx-hcux402-portal.conf).
# Settings shared by every assistant location: forward to HCUX404 over HTTPS and stream answers unbuffered.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host ai.teagasc.net;     # HCUX404's server block (not this site's hostname)
proxy_ssl_server_name on;                  # send SNI so HCUX404 presents the ai.teagasc.net certificate
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_buffering off;                       # answers stream (NDJSON / SSE)
proxy_cache off;
proxy_read_timeout 600s;                   # Research deep research takes 2-3 minutes
client_max_body_size 25m;                  # voice recordings and Teag-Ask attachments
