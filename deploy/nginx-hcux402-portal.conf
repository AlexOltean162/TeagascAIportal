# HCUX402: add these inside the server block that already serves the AI Portal at /aiportal/.
#
# The portal and the Assistants hub are static files served by that existing /aiportal/ location. The
# assistant apps run on HCUX404, so the hub's API calls are forwarded to HCUX404's nginx at
# https://ai.teagasc.net/assistant-api/ (see nginx-hcux404-assistant-api.conf; it only accepts HCUX402).
#
# Also add this inside the existing /aiportal/ location, so browsers re-check the portal and hub files
# (cheap 304s) and never keep an old copy:
#     add_header Cache-Control "no-cache";
#
# The hub's own files live under /aiportal/assistants/, so each app gets its own location here, not one
# /aiportal/assistants/ block (that would hide the static hub files).

# Visiting an app's folder without the trailing slash would break its relative paths.
location = /aiportal/assistants/research { return 301 /aiportal/assistants/research/; }
location = /aiportal/assistants/policy   { return 301 /aiportal/assistants/policy/; }
location = /aiportal/assistants/handbook { return 301 /aiportal/assistants/handbook/; }

location /aiportal/assistants/research/ {
    proxy_pass https://ai.teagasc.net/assistant-api/research/;
    include /etc/nginx/snippets/aiportal-assistant-proxy.conf;
}
location /aiportal/assistants/policy/ {
    proxy_pass https://ai.teagasc.net/assistant-api/policy/;
    include /etc/nginx/snippets/aiportal-assistant-proxy.conf;
}
location /aiportal/assistants/handbook/ {
    proxy_pass https://ai.teagasc.net/assistant-api/handbook/;
    include /etc/nginx/snippets/aiportal-assistant-proxy.conf;
}

# Teag-Ask: its interface is in the portal (aiportal/teagask/); only its API is on HCUX404.
location /aiportal/teagask/api/ {
    proxy_pass https://ai.teagasc.net/assistant-api/teagask/api/;
    include /etc/nginx/snippets/aiportal-assistant-proxy.conf;
}
