# Locations for the Teagasc Assistants hub. Include these inside the existing
# ai.teagasc.net server block, next to the location that already serves /aiportal/.
#
# The hub itself (aiportal/assistants/) is static and is served with the rest of the portal.
# Each assistant app is proxied under the hub's folder. The trailing slash on proxy_pass
# strips the prefix, so the apps keep serving from "/" and need no base-path setting.
#
# In the existing /aiportal/ location, add:  add_header Cache-Control "no-cache";
# so browsers re-check the portal and hub files (cheap 304s) and never keep an old copy.
# The hub's index.html also versions its scripts (?v=N); bump N when you change them.
#
# Ports: Research 8000 (docker compose), Policy 8020 and Staff Handbook 8030 (systemd units in the Policy
# repo), Teag-Ask 8040. The apps have no pages of their own: the portal and hub are the only interface.

# Visiting the folder without a trailing slash would break the apps' relative paths.
location = /aiportal/assistants/research { return 301 /aiportal/assistants/research/; }
location = /aiportal/assistants/policy   { return 301 /aiportal/assistants/policy/; }
location = /aiportal/assistants/handbook { return 301 /aiportal/assistants/handbook/; }

location /aiportal/assistants/research/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Answers stream as NDJSON: never buffer them.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

location /aiportal/assistants/policy/ {
    proxy_pass http://127.0.0.1:8020/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Answers stream as server-sent events: never buffer them.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    # Voice questions upload short audio clips.
    client_max_body_size 25m;
}

# Staff Handbook: the Policy Assistant app run with handbook.env (ASSISTANT_PROFILE=handbook),
# see deploy/handbook-assistant.service in that repo. If it is down the hub shows
# "Staff Handbook isn't available right now" instead of an error page.
location /aiportal/assistants/handbook/ {
    proxy_pass http://127.0.0.1:8030/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
}

# Teag-Ask: its interface is copied into the portal (aiportal/teagask/, see deploy/sync_teagask.py).
# Its API is the Teag-Ask app self-hosted on this server, run without APP_ACCESS_KEY so there is
# no access screen.
location /aiportal/teagask/api/ {
    proxy_pass http://127.0.0.1:8040/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Answers stream as NDJSON: never buffer them.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    # Voice clips and attachments.
    client_max_body_size 25m;
}
