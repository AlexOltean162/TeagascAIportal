<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teagasc AI Knowledge Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Slab:wght@500;600&display=swap" />
  <script src="theme.js?v=2"></script>
  <link rel="stylesheet" href="theme.css?v=2" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="teagasc-logo.png" alt="Teagasc" width="444" height="156" />
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      <span data-theme-label>Dark mode</span>
    </button>
  </header>

  <main class="page">
    <div class="intro">
      <h1>Teagasc AI Knowledge Portal</h1>
      <p>Access Teagasc's suite of AI agents</p>
    </div>

    <section class="tools" aria-label="AI tools">
      <article class="tool">
        <!-- TeagascGPT: a Teag-Ask-style speech bubble (square tail corner) holding an AI spark, with a lime ring arc -->
        <svg class="tool-logo" viewBox="0 0 120 120" role="img" aria-label="TeagascGPT">
          <path d="M88 7a40 40 0 0 1 25 25" fill="none" stroke="#c2cd23" stroke-width="6" stroke-linecap="round"/>
          <path fill="#008752" d="M44 14h32a30 30 0 0 1 30 30v32a30 30 0 0 1-30 30H20a6 6 0 0 1-6-6V44a30 30 0 0 1 30-30z"/>
          <path fill="#fff" d="M60 34c2 16 8 22 24 24-16 2-22 8-24 24-2-16-8-22-24-24 16-2 22-8 24-24z"/>
          <path fill="#c2cd23" d="M84 27c1 6 3 8 9 9-6 1-8 3-9 9-1-6-3-8-9-9 6-1 8-3 9-9z"/>
        </svg>
        <h2>TeagascGPT</h2>
        <p>Chat, write, code and more</p>
        <a class="tool-button" href="https://ai.teagasc.net/login">Open</a>
      </article>

      <article class="tool">
        <img class="tool-logo tool-logo-wide" src="icons/teag-ask.svg" alt="Teag-Ask" />
        <h2>Teag-Ask</h2>
        <p>Farming and advisory knowledge</p>
        <a class="tool-button" href="teagask/">Open</a>
      </article>

      <article class="tool">
        <!-- Assistants: three Teag-Ask-style bubbles in the brand greens, the front one "typing" -->
        <svg class="tool-logo" viewBox="0 0 120 120" role="img" aria-label="Assistants">
          <g class="bubble-gap">
            <path fill="#c2cd23" d="M70 10h24a18 18 0 0 1 18 18v10a18 18 0 0 1-18 18H56a4 4 0 0 1-4-4V28a18 18 0 0 1 18-18z"/>
            <path fill="#49aa42" d="M50 32h24a18 18 0 0 1 18 18v10a18 18 0 0 1-18 18H36a4 4 0 0 1-4-4V50a18 18 0 0 1 18-18z"/>
            <path fill="#008752" d="M30 56h24a18 18 0 0 1 18 18v10a18 18 0 0 1-18 18H16a4 4 0 0 1-4-4V74a18 18 0 0 1 18-18z"/>
          </g>
          <circle cx="29" cy="79" r="4.5" fill="#fff"/>
          <circle cx="42" cy="79" r="4.5" fill="#fff"/>
          <circle cx="55" cy="79" r="4.5" fill="#fff"/>
        </svg>
        <h2>Assistants</h2>
        <p>Specialist assistants</p>
        <a class="tool-button" href="assistants/">Open</a>
      </article>
    </section>

    <section class="governance" aria-label="AI policy and training">
      <a class="governance-card" href="./Teagasc_AI_Policy_1.0.pdf">
        <svg class="governance-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#008752" d="M14 4h16l10 10v26a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/>
          <path fill="#c2cd23" d="M30 4v6a4 4 0 0 0 4 4h6z"/>
          <path fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" d="M16 21h13M16 27h15M16 33h8"/>
          <circle class="badge-gap" cx="36" cy="37" r="9" fill="#c2cd23"/>
          <path fill="none" stroke="#005d31" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M32 37.5l3 3 5.5-6"/>
        </svg>
        <span class="governance-text">
          <strong>Teagasc AI Policy</strong>
          <span>Read before using AI at work</span>
        </span>
      </a>
      <a class="governance-card" href="https://tlearn.teagasc.ie/totara/program/view.php?id=31">
        <img class="governance-icon" src="./Foundational-AI-Icon.png" alt="" width="48" height="48" />
        <span class="governance-text">
          <strong>AI literacy training</strong>
          <span>Foundational course on tLearn</span>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
